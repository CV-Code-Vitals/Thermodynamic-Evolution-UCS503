/* ─────────────────────────────────────────────
   COLOUR PALETTE  (entropy → colour)
   ───────────────────────────────────────────── */
function heatColor(s) {
  if (s >= 70) return '#ff4444';       // Critical – bright red
  if (s >= 50) return '#ff6633';       // High – orange-red
  if (s >= 30) return '#ffaa00';       // Medium – orange
  if (s >= 15) return '#FFD700';       // Moderate – Gold
  if (s >= 10) return '#b89920';       // Low – Dim Gold
  return '#555555';                    // Safe – Muted gray
}

function heatGlow(s) {
  if (s >= 70) return 'rgba(255,68,68,0.6)';
  if (s >= 50) return 'rgba(255,102,51,0.5)';
  if (s >= 30) return 'rgba(255,170,0,0.4)';
  if (s >= 15) return 'rgba(255,215,0,0.35)';
  if (s >= 10) return 'rgba(184,153,32,0.3)';
  return 'rgba(85,85,85,0.25)';
}

function nodeRadius(entropy, type) {
  const base = type === 'file' ? 22 : 10;
  return base + Math.log10(entropy + 1) * 6;
}

/* ─────────────────────────────────────────────
   BUILD DATA MODEL — Deduplicated nodes,
   evolutionary phases
   ───────────────────────────────────────────── */
let allNodesMap = new Map();
let allNodes = [];
let snapshots = [];
let currentPhase = 0;
let activeNodes = [];
let activeLinks = [];

function buildData() {
  allNodesMap.clear();
  snapshots = [];

  // Create file nodes
  const fileNodes = {};
  REPORT.file_reports.forEach(r => {
    const fn = r.file_path.split('/').pop();
    const n = {
      id: 'f_' + fn, type: 'file', label: fn, fileShort: fn,
      entropy: r.total_entropy, language: r.language,
      radius: nodeRadius(r.total_entropy, 'file'),
      x: 0, y: 0, vx: 0, vy: 0, targetX: 0, targetY: 0,
      opacity: 0, targetOpacity: 0, scale: 0, targetScale: 0,
      vulnType: null, description: null, lineNumber: null
    };
    fileNodes[fn] = n;
    allNodesMap.set(n.id, n);
  });

  // Gather all hotspots
  const allHotspots = REPORT.file_reports.flatMap(r =>
    r.hotspots.map(h => ({ ...h, file_path: r.file_path, file_short: r.file_path.split('/').pop() }))
  );

  // De-duplicate hotspots by function name (take highest entropy)
  const uniqueFns = new Map();
  allHotspots.forEach(h => {
    const key = h.function_name + '|' + h.file_short;
    if (!uniqueFns.has(key) || uniqueFns.get(key).entropy_score < h.entropy_score) {
      uniqueFns.set(key, h);
    }
  });
  const dedupedHotspots = Array.from(uniqueFns.values());

  // Create hotspot nodes
  dedupedHotspots.forEach(h => {
    const id = 'h_' + h.function_name + '_' + h.file_short;
    if (!allNodesMap.has(id)) {
      allNodesMap.set(id, {
        id, type: 'hotspot', label: h.function_name, fileShort: h.file_short,
        entropy: h.entropy_score, vulnType: h.vulnerability_type,
        description: h.description, lineNumber: h.line_number,
        radius: nodeRadius(h.entropy_score, 'hotspot'),
        x: 0, y: 0, vx: 0, vy: 0, targetX: 0, targetY: 0,
        opacity: 0, targetOpacity: 0, scale: 0, targetScale: 0
      });
    }
  });

  allNodes = Array.from(allNodesMap.values());

  // ── Phase 1: data_pipeline.py ──
  const p1nodes = [];
  const p1links = [];
  p1nodes.push(fileNodes['data_pipeline.py']);
  dedupedHotspots.filter(h => h.file_short === 'data_pipeline.py').forEach(h => {
    const id = 'h_' + h.function_name + '_' + h.file_short;
    const n = allNodesMap.get(id);
    p1nodes.push(n);
    p1links.push({ sourceId: id, targetId: 'f_data_pipeline.py' });
  });
  snapshots.push({ nodes: p1nodes, links: p1links });

  // ── Phase 2: + crawler.go ──
  const p2nodes = [...p1nodes, fileNodes['crawler.go']];
  const p2links = [...p1links];
  dedupedHotspots.filter(h => h.file_short === 'crawler.go').forEach(h => {
    const id = 'h_' + h.function_name + '_' + h.file_short;
    const n = allNodesMap.get(id);
    p2nodes.push(n);
    p2links.push({ sourceId: id, targetId: 'f_crawler.go' });
  });
  // call graph edges
  REPORT.call_graph.forEach(c => {
    const sId = 'h_' + c.caller + '_crawler.go';
    const tId = 'h_' + c.callee + '_crawler.go';
    if (allNodesMap.has(sId) && allNodesMap.has(tId) && p2nodes.some(n => n.id === sId) && p2nodes.some(n => n.id === tId)) {
      p2links.push({ sourceId: sId, targetId: tId, isCall: true });
    }
  });
  snapshots.push({ nodes: p2nodes, links: p2links });

  // ── Phase 3: + utils.py ──
  const p3nodes = [...p2nodes, fileNodes['utils.py']];
  const p3links = [...p2links];
  dedupedHotspots.filter(h => h.file_short === 'utils.py').forEach(h => {
    const id = 'h_' + h.function_name + '_' + h.file_short;
    const n = allNodesMap.get(id);
    p3nodes.push(n);
    p3links.push({ sourceId: id, targetId: 'f_utils.py' });
  });
  snapshots.push({ nodes: p3nodes, links: p3links });
}

const canvas = document.getElementById('graph-canvas');
const ctx = canvas.getContext('2d');
let W, H;

function screenToWorld(sx, sy) {

}

function resizeCanvas() {

  W = area.clientWidth;

/* ─────────────────────────────────────────────
   ORGANIC FORCE-DIRECTED PHYSICS (2D)
   ───────────────────────────────────────────── */
function layoutPhase() {
  const nodes = activeNodes;
  const links = activeLinks;
  const cx = W / 2, cy = H / 2;

  // Scatter new nodes around their file-parent or center
  nodes.forEach(n => {
    if (n.x === 0 && n.y === 0) {
      // Find parent file node position
      const parentLink = links.find(l => l.sourceId === n.id && !l.isCall);
      const parent = parentLink ? allNodesMap.get(parentLink.targetId) : null;
      if (parent && parent.x !== 0) {
        n.x = parent.x + (Math.random() - 0.5) * 120;
        n.y = parent.y + (Math.random() - 0.5) * 120;
      } else {
        n.x = cx + (Math.random() - 0.5) * (W * 0.6);
        n.y = cy + (Math.random() - 0.5) * (H * 0.6);
      }
      n.targetX = n.x;
      n.targetY = n.y;
    }
  });
}

function physicsTick() {
  const nodes = activeNodes;
  const links = activeLinks;
  const REPULSION = 2000;
  const LINK_STRENGTH = 0.008;
  const LINK_DIST = 130;
  const CALL_DIST = 90;
  const CENTER_GRAVITY = 0.0006;
  const DAMPING = 0.75;
  const cx = W / 2, cy = H / 2;

  // Center gravity
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    if (n.targetScale < 0.01) continue;
    n.vx += (cx - n.x) * CENTER_GRAVITY;
    n.vy += (cy - n.y) * CENTER_GRAVITY;
  }

  // Repulsion
  for (let i = 0; i < nodes.length; i++) {
    const a = nodes[i];
    if (a.targetScale < 0.01) continue;
    for (let j = i + 1; j < nodes.length; j++) {
      const b = nodes[j];
      if (b.targetScale < 0.01) continue;
      let dx = a.x - b.x, dy = a.y - b.y;
      let distSq = dx * dx + dy * dy + 1;
      let f = REPULSION * ((a.radius + b.radius) / 30) / distSq;
      let dist = Math.sqrt(distSq);
      a.vx += (dx / dist) * f;
      a.vy += (dy / dist) * f;
      b.vx -= (dx / dist) * f;
      b.vy -= (dy / dist) * f;
    }
  }

  // Links
  links.forEach(l => {
    const src = allNodesMap.get(l.sourceId);
    const tgt = allNodesMap.get(l.targetId);
    if (!src || !tgt) return;
    if (src.targetScale < 0.01 || tgt.targetScale < 0.01) return;
    let dx = tgt.x - src.x, dy = tgt.y - src.y;
    let dist = Math.sqrt(dx * dx + dy * dy + 1);
    let desired = l.isCall ? CALL_DIST : LINK_DIST;
    let f = (dist - desired) * LINK_STRENGTH;
    src.vx += (dx / dist) * f;
    src.vy += (dy / dist) * f;
    tgt.vx -= (dx / dist) * f;
    tgt.vy -= (dy / dist) * f;
  });

  // Integrate
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    n.vx *= DAMPING;
    n.vy *= DAMPING;
    n.x += n.vx;
    n.y += n.vy;
    // Clamp inside viewport with margin
    n.x = Math.max(n.radius + 30, Math.min(W - n.radius - 30, n.x));
    n.y = Math.max(n.radius + 60, Math.min(H - n.radius - 100, n.y));
  }
}

/* ─────────────────────────────────────────────
   PHASE SYNC
   ───────────────────────────────────────────── */
function syncPhase(idx) {
  currentPhase = idx;
  const snap = snapshots[idx];
  activeNodes = snap.nodes;
  activeLinks = snap.links;

  const activeSet = new Set(activeNodes.map(n => n.id));

  allNodes.forEach(n => {
    if (activeSet.has(n.id)) {
      n.targetOpacity = 1;
      n.targetScale = 1;
    } else {
      n.targetOpacity = 0;
      n.targetScale = 0;
    }
  });

  layoutPhase();
  updateSidebar();
}

/* ─────────────────────────────────────────────
   RENDER  (Canvas 2D — guaranteed visible!)
   ───────────────────────────────────────────── */
const time0 = Date.now();

function draw() {
  const t = (Date.now() - time0) * 0.001;

  ctx.save();
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // Apply zoom & pan
  ctx.save();
  ctx.translate(panX, panY);
  ctx.scale(zoom, zoom);

  // Run physics
  physicsTick();

  // Smoothly animate opacity / scale

    n.scale += (n.targetScale - n.scale) * 0.03;

    if (src.opacity < 0.02 || tgt.opacity < 0.02) return;

    const dx = tgt.x - src.x, dy = tgt.y - src.y;

      ctx.setLineDash([6, 4]);
      ctx.lineDashOffset = -t * 30;
    } else {
      // File-to-hotspot edge: solid glow

      ctx.lineWidth = 1;

    ctx.moveTo(src.x, src.y);
    ctx.lineTo(tgt.x, tgt.y);

      ctx.fill();
    }

    ctx.restore();
  });

  // ── Draw nodes ──
  activeNodes.forEach(n => {
    if (n.opacity < 0.02) return;

    const s = n.scale;
    const r = n.radius * s;
    const breath = 1 + Math.sin(t * 1.2 + n.entropy * 0.1) * 0.03;
    const drawR = r * breath;
    const color = heatColor(n.entropy);
    const glow = heatGlow(n.entropy);

    ctx.save();
    ctx.globalAlpha = n.opacity;

    // Outer glow
    const gradient = ctx.createRadialGradient(n.x, n.y, drawR * 0.3, n.x, n.y, drawR * 2.5);
    gradient.addColorStop(0, glow);
    gradient.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(n.x, n.y, drawR * 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Node circle
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.arc(n.x, n.y, drawR, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Inner highlight
    const inner = ctx.createRadialGradient(n.x - drawR * 0.3, n.y - drawR * 0.3, 0, n.x, n.y, drawR);
    inner.addColorStop(0, 'rgba(255,255,255,0.3)');
    inner.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = inner;
    ctx.beginPath();
    ctx.arc(n.x, n.y, drawR, 0, Math.PI * 2);
    ctx.fill();

    // Label
    ctx.fillStyle = '#c9d1d9';
    ctx.font = n.type === 'file' ? 'bold 12px Inter' : '11px Inter';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    const label = n.label.length > 16 ? n.label.slice(0, 14) + '…' : n.label;
    ctx.fillText(label, n.x, n.y + drawR + 6);

    ctx.restore();
  });

  ctx.restore(); // zoom/pan transform
  ctx.restore(); // setTransform
  requestAnimationFrame(draw);
}

/* ─────────────────────────────────────────────
   HOVER TOOLTIP
   ───────────────────────────────────────────── */
const tooltip = document.getElementById('tooltip');
let hoveredNode = null;

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const { x: mx, y: my } = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);

  let found = null;
  // Check in reverse so topmost drawn node is picked first
  for (let i = activeNodes.length - 1; i >= 0; i--) {
    const n = activeNodes[i];
    if (n.opacity < 0.1) continue;
    const dx = mx - n.x, dy = my - n.y;
    if (dx * dx + dy * dy < (n.radius * n.scale + 8) * (n.radius * n.scale + 8)) {
      found = n;
      break;
    }
  }

  if (found) {
    if (hoveredNode !== found) {
      hoveredNode = found;
      const vulnClass = found.entropy >= 50 ? 'high' : found.entropy >= 20 ? 'med' : 'low';
      tooltip.innerHTML = `
        <h3>${found.type === 'file' ? '📄' : '⚡'} ${found.label}</h3>
        <p>File: <span class="metric">${found.fileShort}</span></p>
        <p>Entropy: <span class="metric">${found.entropy.toFixed(1)}</span></p>
        ${found.vulnType ? `<p>Type: <span class="metric">${found.vulnType}</span></p>` : ''}
        ${found.lineNumber ? `<p>Line: <span class="metric">${found.lineNumber}</span></p>` : ''}
        ${found.description ? `<p style="margin-top:6px;font-size:11px;color:#6e7681">${found.description}</p>` : ''}
        <div class="vuln-tag ${vulnClass}">${found.entropy >= 50 ? '🔴 Critical' : found.entropy >= 20 ? '🟡 Medium' : '🟢 Low'} Risk</div>
      `;
      tooltip.style.display = 'block';
    }
    tooltip.style.left = (e.clientX + 16) + 'px';
    tooltip.style.top = (e.clientY + 16) + 'px';
    canvas.style.cursor = 'pointer';
  } else {
    if (hoveredNode) {
      hoveredNode = null;
      tooltip.style.display = 'none';
      canvas.style.cursor = 'crosshair';
    }
  }
});

canvas.addEventListener('mouseleave', () => {
  hoveredNode = null;
  tooltip.style.display = 'none';
  canvas.style.cursor = 'crosshair';
});

/* ─────────────────────────────────────────────
   DRAG NODES
   ───────────────────────────────────────────── */
let dragNode = null;
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('mousedown', e => {
  // Right-click or middle-click: start panning
  if (e.button === 2 || e.button === 1) {
    isPanning = true;
    panStartX = e.clientX - panX;
    panStartY = e.clientY - panY;
    canvas.style.cursor = 'grabbing';
    return;
  }
  const rect = canvas.getBoundingClientRect();
  const { x: mx, y: my } = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
  for (let i = activeNodes.length - 1; i >= 0; i--) {
    const n = activeNodes[i];
    if (n.opacity < 0.1) continue;
    const dx = mx - n.x, dy = my - n.y;
    if (dx * dx + dy * dy < (n.radius * n.scale + 8) ** 2) {
      dragNode = n;
      break;
    }
  }
});
window.addEventListener('mousemove', e => {
  if (isPanning) {
    panX = e.clientX - panStartX;
    panY = e.clientY - panStartY;
    return;
  }
  if (!dragNode) return;
  const rect = canvas.getBoundingClientRect();
  const { x, y } = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
  dragNode.x = x;
  dragNode.y = y;
  dragNode.vx = 0;
  dragNode.vy = 0;
});
window.addEventListener('mouseup', () => { dragNode = null; isPanning = false; canvas.style.cursor = 'crosshair'; });

// Scroll to zoom
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  const newZoom = Math.max(0.2, Math.min(5, zoom * delta));
  // Zoom towards cursor
  panX = mx - (mx - panX) * (newZoom / zoom);
  panY = my - (my - panY) * (newZoom / zoom);
  zoom = newZoom;
}, { passive: false });

/* ─────────────────────────────────────────────
   SIDEBAR UI
   ───────────────────────────────────────────── */
// Adaptive slider color settings (from watermelon component)
function getSliderColors(phase, total) {
  const pct = phase / (total - 1);
  if (pct < 0.5) return { text: '#b89920', gradient: 'linear-gradient(to right, #9a8a50, #b89920)', thumb: '#FFD700' };
  if (pct < 0.8) return { text: '#FFD700', gradient: 'linear-gradient(to right, #b89920, #FFD700)', thumb: '#FFD700' };
  return { text: '#FFD700', gradient: 'linear-gradient(to right, #FFD700, #ffaa00)', thumb: '#ffaa00' };
}

function updateSliderUI() {
  const pct = currentPhase / (PHASES.length - 1) * 100;
  const colors = getSliderColors(currentPhase, PHASES.length);

  // Fill width: accounts for thumb size (28px)
  const fill = document.getElementById('as-fill');
  fill.style.width = `calc((${pct} / 100) * (100% - 28px) + 28px)`;
  fill.style.background = colors.gradient;

  // Thumb position
  const thumb = document.getElementById('as-thumb');
  thumb.style.left = `calc((${pct} / 100) * (100% - 28px))`;

  // Phase label
  const label = document.getElementById('as-phase-label');
  label.textContent = PHASES[currentPhase].label;
  label.style.color = colors.text;

  // Dot markers
  document.querySelectorAll('.as-dot').forEach((d, i) => d.classList.toggle('active', i <= currentPhase));

  // Range input
  document.getElementById('as-range').value = currentPhase;
}

function updateSidebar() {
  document.getElementById('phase-label').textContent = PHASES[currentPhase].label;
  document.getElementById('phase-desc').textContent = PHASES[currentPhase].desc;
  const iconBase = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
  const phaseIcons = [
    iconBase + '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>',
    iconBase + '<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><path d="M6 9v2a2 2 0 0 0 2 2h3"/></svg>',
    iconBase + '<path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>'
  ];
  document.getElementById('phase-icon').innerHTML = phaseIcons[currentPhase] || phaseIcons[0];
  updateSliderUI();

  let ent = 0;
  activeNodes.forEach(n => ent += n.entropy);
  document.getElementById('sb-ent').textContent = ent.toFixed(1);
  document.getElementById('sb-hot').textContent = activeNodes.filter(n => n.type === 'hotspot').length;
  document.getElementById('sb-files').textContent = new Set(activeNodes.map(n => n.fileShort)).size;


}

/* ─────────────────────────────────────────────
   TIMELINE
   ───────────────────────────────────────────── */
let playTimer = null;
document.getElementById('tl-play').onclick = function() {
  if (playTimer) {
    clearInterval(playTimer); playTimer = null;
    this.innerHTML = '&#9654;'; this.classList.remove('playing');
  } else {
    this.innerHTML = '&#9632;'; this.classList.add('playing');
    playTimer = setInterval(() => {
      let next = (currentPhase + 1) % PHASES.length;
      syncPhase(next);
      if (next === PHASES.length - 1) {
        clearInterval(playTimer); playTimer = null;
        this.innerHTML = '&#9654;'; this.classList.remove('playing');
      }
    }, 4000);
  }
};

/* ─────────────────────────────────────────────
   SEARCH
   ───────────────────────────────────────────── */
document.getElementById('search-box').addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  activeNodes.forEach(n => {
    if (!q) {
      n.targetOpacity = 1;
      n.targetScale = 1;
    } else if (n.label.toLowerCase().includes(q) || n.fileShort.toLowerCase().includes(q)) {
      n.targetOpacity = 1;
      n.targetScale = 1.2;
    } else {
      n.targetOpacity = 0.15;
      n.targetScale = 0.6;
    }
  });
});

/* ─────────────────────────────────────────────
   DYNAMIC REPO SCANNING
   ───────────────────────────────────────────── */
document.getElementById('scan-btn').addEventListener('click', async function() {
  const repoUrl = document.getElementById('repo-box').value.trim();
  if (!repoUrl) return alert("Please enter a GitHub URL");
  
  document.getElementById('loading-overlay').style.display = 'flex';
  
  try {
    // Determine API URL based on where the visualizer is running
    const apiUrl = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
      ? 'http://localhost:8080/scan' 
      : '/api/scan';
      
    const res = await fetch(apiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ repo_url: repoUrl })
    });
    
    if (!res.ok) {
      const errText = await res.text();
      throw new Error(errText);
    }
    
    const newReport = await res.json();
    REPORT = newReport;
    
    // Re-initialize graph
    buildData();
    syncPhase(0);
  } catch (err) {
    alert("Scan failed: " + err.message);
  } finally {
    document.getElementById('loading-overlay').style.display = 'none';
  }
});

/* ─────────────────────────────────────────────
   INIT
   ───────────────────────────────────────────── */
buildData();
resizeCanvas();

// Build adaptive slider dots
const dotsContainer = document.getElementById('as-dots');
PHASES.forEach((p, i) => {
  const dot = document.createElement('div');
  dot.className = 'as-dot';
  dot.onclick = () => syncPhase(i);
  const lbl = document.createElement('div');
  lbl.className = 'as-dot-label';
  lbl.textContent = p.label;
  dot.appendChild(lbl);
  dotsContainer.appendChild(dot);
});

// Range input for slider dragging
document.getElementById('as-range').setAttribute('max', PHASES.length - 1);
document.getElementById('as-range').addEventListener('input', function() {
  syncPhase(parseInt(this.value));
});

// Build file list (PinItem style cards)
const fl = document.getElementById('file-list');
const svgb = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
const langIcons = { 
  'Go': svgb + '<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>', 
  'Python': svgb + '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><polyline points="16 13 12 17 16 21"/></svg>'
};
const langColors = { 'Go': '#00ADD8', 'Python': '#3572A5' };
const defaultIcon = svgb + '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';

// "All Files" card
const allCard = document.createElement('div');
allCard.className = 'file-card selected';
allCard.innerHTML = `
  <div class="file-card-icon">${svgb}<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></div>
  <div class="file-card-info">
    <div class="file-card-name">All Files</div>
    <div class="file-card-meta"><span>${allNodes.length} nodes</span> • All modules</div>
  </div>
  <div class="file-card-check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
`;
allCard.onclick = () => {
  document.querySelectorAll('.file-card').forEach(c => c.classList.remove('selected'));
  allCard.classList.add('selected');
  activeNodes.forEach(n => { n.targetOpacity = 1; n.targetScale = 1; });
};
fl.appendChild(allCard);

// Per-file cards
const fileReports = REPORT.file_reports;
const uniqueFiles = [...new Set(allNodes.map(n => n.fileShort))];
uniqueFiles.forEach(f => {
  const report = fileReports.find(r => r.file_path.endsWith(f));
  const lang = report ? report.language : 'Unknown';
  const entropy = report ? report.total_entropy : 0;
  const hotspots = report ? report.hotspots.length : 0;
  const icon = langIcons[lang] || defaultIcon;

  const card = document.createElement('div');
  card.className = 'file-card';
  card.innerHTML = `
    <div class="file-card-icon">${icon}</div>
    <div class="file-card-info">
      <div class="file-card-name">${f}</div>
      <div class="file-card-meta"><span>${lang}</span> • ${hotspots} hotspots • <span style="color:${entropy > 500 ? '#f85149' : entropy > 100 ? '#ffaa00' : '#3fb950'}">${entropy.toFixed(0)} entropy</span></div>
    </div>
    <div class="file-card-check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
  `;
  card.onclick = () => {
    document.querySelectorAll('.file-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    activeNodes.forEach(n => {
      if (n.fileShort === f) {
        n.targetOpacity = 1; n.targetScale = 1.15;
      } else {
        n.targetOpacity = 0.12; n.targetScale = 0.5;
      }
    });
  };
  fl.appendChild(card);
});

// Start!
syncPhase(0);
draw();
</script>
