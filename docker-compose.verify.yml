# Isolated container verification. Use project name ucs503-verification.
services:
  ucs503-api:
    environment:
      APP_ENV: development
      ADMIN_PASSKEY: ${PORTAL_TEST_PASSKEY:?Set a disposable verification passkey}
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:18080
    ports:
      - "127.0.0.1:18080:8080"
