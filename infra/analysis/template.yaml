  LifecycleWatchdogFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - LifecycleWatchdogLogGroup
    Properties:
      FunctionName: !Sub ['${ResourcePrefix}-sandbox-watchdog-${StackSuffix}', {StackSuffix: !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]}]
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt LifecycleWatchdogRole.Arn
      Timeout: 60
      MemorySize: 128
      Environment:
        Variables:
          LIFECYCLE_TABLE: !Ref AnalysisLifecycleTable
          LIFECYCLE_ITEM_ID: sandbox-lifecycle
          SANDBOX_INSTANCE_ID: !Ref SandboxInstance
      Code:
        ZipFile: |
          const { DynamoDBClient, GetItemCommand, UpdateItemCommand } = require('@aws-sdk/client-dynamodb');
          const { EC2Client, DescribeInstancesCommand, StopInstancesCommand } = require('@aws-sdk/client-ec2');
          const ddb = new DynamoDBClient({});
          const ec2 = new EC2Client({});
          const table = process.env.LIFECYCLE_TABLE;
          const itemId = process.env.LIFECYCLE_ITEM_ID;
          const instanceId = process.env.SANDBOX_INSTANCE_ID;

          const number = (value) => Number(value?.N ?? 0);
          const key = { id: { S: itemId } };
          const conditionalFailure = (error) => error?.name === 'ConditionalCheckFailedException';
          async function readItem() {
            const response = await ddb.send(new GetItemCommand({
              TableName: table,
              Key: key,
              ConsistentRead: true,
            }));
            return response.Item;
          }

          async function updateIdleFromStarting(idleUntil) {
            try {
              await ddb.send(new UpdateItemCommand({
                TableName: table,
                Key: key,
                UpdateExpression: 'SET #state = :idle, #deadline = :deadline',
                ConditionExpression: '#state = :starting AND #active = :zero',
                ExpressionAttributeNames: { '#state': 'state', '#active': 'active_count', '#deadline': 'idle_until_epoch' },
                ExpressionAttributeValues: {
                  ':idle': { S: 'idle' },
                  ':starting': { S: 'starting' },
                  ':zero': { N: '0' },
                  ':deadline': { N: String(idleUntil) },
                },
              }));
            } catch (error) {
              if (!conditionalFailure(error)) throw error;
            }
          }

          async function updateIdleFromStopping() {
            try {
              await ddb.send(new UpdateItemCommand({
                TableName: table,
                Key: key,
                UpdateExpression: 'SET #state = :idle, #deadline = :zero',
                ConditionExpression: '#state = :stopping AND #active = :zero',
                ExpressionAttributeNames: { '#state': 'state', '#active': 'active_count', '#deadline': 'idle_until_epoch' },
                ExpressionAttributeValues: {
                  ':idle': { S: 'idle' },
                  ':stopping': { S: 'stopping' },
                  ':zero': { N: '0' },
                },
              }));
            } catch (error) {
              if (!conditionalFailure(error)) throw error;
            }
          }

          async function stopClaimedInstance() {
            const response = await ec2.send(new DescribeInstancesCommand({ InstanceIds: [instanceId] }));
            const state = response.Reservations?.[0]?.Instances?.[0]?.State?.Name;
            if (!state) throw new Error('configured sandbox instance was not returned by EC2');
            if (state === 'stopped' || state === 'terminated') {
              await updateIdleFromStopping();
              return;
            }
            if (state === 'stopping') return;
            if (state !== 'running' && state !== 'pending') {
              throw new Error(`configured sandbox instance is in unsupported state: ${state}`);
            }
            await ec2.send(new StopInstancesCommand({ InstanceIds: [instanceId] }));
          }

          async function rollbackStopClaim(error) {
            try {
              await ddb.send(new UpdateItemCommand({
                TableName: table,
                Key: key,
                UpdateExpression: 'SET #state = :idle',
                ConditionExpression: '#state = :stopping AND #active = :zero',
                ExpressionAttributeNames: { '#state': 'state', '#active': 'active_count' },
                ExpressionAttributeValues: {
                  ':idle': { S: 'idle' },
                  ':stopping': { S: 'stopping' },
                  ':zero': { N: '0' },
                },
              }));
            } catch (rollbackError) {
              if (!conditionalFailure(rollbackError)) {
                console.error('sandbox watchdog could not restore lifecycle state', { code: rollbackError?.name ?? 'UnknownError' });
              }
            }
            console.error('sandbox watchdog operation failed', { code: error?.name ?? 'UnknownError' });
          }

          exports.handler = async () => {
            const now = Math.floor(Date.now() / 1000);
            let item = await readItem();
            if (!item) return;
            for (const [leaseId, expiry] of Object.entries(item.leases?.M ?? {})) {
              if (number(expiry) > now) continue;
              try {
                await ddb.send(new UpdateItemCommand({
                  TableName: table,
                  Key: key,
                  UpdateExpression: 'REMOVE #leases.#lease ADD #active :decrement',
                  ConditionExpression: '#leases.#lease = :expiry AND #active > :zero',
                  ExpressionAttributeNames: { '#leases': 'leases', '#lease': leaseId, '#active': 'active_count' },
                  ExpressionAttributeValues: {
                    ':decrement': { N: '-1' },
                    ':zero': { N: '0' },
                    ':expiry': expiry,
                  },
                }));
              } catch (error) {
                if (!conditionalFailure(error)) throw error;
              }
            }

            item = await readItem();
            if (!item || number(item.active_count) !== 0) return;
            let state = item.state?.S;
            let idleUntil = number(item.idle_until_epoch);

            if (state === 'starting') {
              const response = await ec2.send(new DescribeInstancesCommand({ InstanceIds: [instanceId] }));
              const instanceState = response.Reservations?.[0]?.Instances?.[0]?.State?.Name;
              if (!instanceState) throw new Error('configured sandbox instance was not returned by EC2');
              if (instanceState === 'running') {
                await updateIdleFromStarting(now + 600);
                return;
              }
              if (instanceState === 'stopped' || instanceState === 'terminated') {
                await updateIdleFromStarting(0);
                return;
              }
              if (instanceState === 'stopping') return;
              if (instanceState !== 'pending') {
                throw new Error(`configured sandbox instance is in unsupported state: ${instanceState}`);
              }
              try {
                await ddb.send(new UpdateItemCommand({
                  TableName: table,
                  Key: key,
                  UpdateExpression: 'SET #state = :stopping',
                  ConditionExpression: '#state = :starting AND #active = :zero',
                  ExpressionAttributeNames: { '#state': 'state', '#active': 'active_count' },
                  ExpressionAttributeValues: { ':stopping': { S: 'stopping' }, ':starting': { S: 'starting' }, ':zero': { N: '0' } },
                }));
              } catch (error) {
                if (conditionalFailure(error)) return;
                throw error;
              }
              state = 'stopping';
            }

            if (state === 'running' && idleUntil === 0) {
              try {
                await ddb.send(new UpdateItemCommand({
                  TableName: table,
                  Key: key,
                  UpdateExpression: 'SET #state = :idle, #deadline = :deadline',
                  ConditionExpression: '#state = :running AND #active = :zero AND #deadline = :zero',
                  ExpressionAttributeNames: { '#state': 'state', '#active': 'active_count', '#deadline': 'idle_until_epoch' },
                  ExpressionAttributeValues: {
                    ':idle': { S: 'idle' },
                    ':running': { S: 'running' },
                    ':zero': { N: '0' },
                    ':deadline': { N: String(now + 600) },
                  },
                }));
              } catch (error) {
                if (!conditionalFailure(error)) throw error;
              }
              return;
            }

            if (state === 'idle' && idleUntil > 0 && idleUntil <= now) {
              try {
                await ddb.send(new UpdateItemCommand({
                  TableName: table,
                  Key: key,
                  UpdateExpression: 'SET #state = :stopping',
                  ConditionExpression: '#state = :idle AND #active = :zero AND #deadline > :zero AND #deadline <= :now',
                  ExpressionAttributeNames: { '#state': 'state', '#active': 'active_count', '#deadline': 'idle_until_epoch' },
                  ExpressionAttributeValues: {
                    ':stopping': { S: 'stopping' },
                    ':idle': { S: 'idle' },
                    ':zero': { N: '0' },
                    ':now': { N: String(now) },
                  },
                }));
              } catch (error) {
                if (conditionalFailure(error)) return;
                throw error;
              }
              state = 'stopping';
            }

            if (state !== 'stopping') return;
            try {
              await stopClaimedInstance();
            } catch (error) {
              await rollbackStopClaim(error);
              throw error;
            }
          };
      Tags:
        - Key: AnalysisStack
          Value: !Ref ResourcePrefix

  SandboxWatchdogSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Reconcile expired sandbox leases and stop the sandbox after the idle deadline.
      ScheduleExpression: rate(1 minute)
      State: ENABLED
      Targets:
        - Arn: !GetAtt LifecycleWatchdogFunction.Arn
          Id: SandboxLifecycleWatchdog

  SandboxWatchdogInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LifecycleWatchdogFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SandboxWatchdogSchedule.Arn

  AnalysisAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub '${ResourcePrefix}-admin-token-authorizer'
      Type: REQUEST
      RestApiId: !Ref AnalysisApi
      IdentitySource: method.request.header.Authorization
      AuthorizerResultTtlInSeconds: 0
      AuthorizerUri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerFunction.Arn}/invocations'

  AnalysisApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${ResourcePrefix}-rest-api'
      Description: Public REST API for anonymous scans and authorized Evolution.
      EndpointConfiguration:
        Types:
          - REGIONAL
      DisableExecuteApiEndpoint: false
      Tags:
        - Key: AnalysisStack
          Value: !Ref ResourcePrefix

  AnalysisApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AnalysisApi
      ParentId: !GetAtt AnalysisApi.RootResourceId
      PathPart: api

  ScanApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AnalysisApi
      ParentId: !Ref AnalysisApiResource
      PathPart: scan

  EvolveApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AnalysisApi
      ParentId: !Ref AnalysisApiResource
      PathPart: evolve

  ScanOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AnalysisApi
      ResourceId: !Ref ScanApiResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: '200'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Authorization,Content-Type'"
              method.response.header.Access-Control-Allow-Methods: "'OPTIONS,POST'"
              method.response.header.Access-Control-Allow-Origin: !Sub "'${FrontendOrigin}'"
      MethodResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  EvolveOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AnalysisApi
      ResourceId: !Ref EvolveApiResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: '200'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Authorization,Content-Type'"
              method.response.header.Access-Control-Allow-Methods: "'OPTIONS,POST'"
              method.response.header.Access-Control-Allow-Origin: !Sub "'${FrontendOrigin}'"
      MethodResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  ScanApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AnalysisApi
      ResourceId: !Ref ScanApiResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        ResponseTransferMode: STREAM
        TimeoutInMillis: 900000
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2021-11-15/functions/${ProxyFunction.Arn}/response-streaming-invocations'

  EvolveApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AnalysisApi
      ResourceId: !Ref EvolveApiResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AnalysisAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        ResponseTransferMode: STREAM
        TimeoutInMillis: 900000
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2021-11-15/functions/${ProxyFunction.Arn}/response-streaming-invocations'

  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ApiGatewayAccessLogging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                  - logs:GetLogEvents
                  - logs:FilterLogEvents
                Resource: '*'

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

  AnalysisApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub ['/aws/apigateway/${ResourcePrefix}-analysis-${StackSuffix}', {StackSuffix: !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]}]
      RetentionInDays: 365

  AnalysisApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ScanApiMethod
      - ScanOptionsMethod
      - EvolveApiMethod
      - EvolveOptionsMethod
      - AnalysisApiDefault4xxCors
      - AnalysisApiDefault5xxCors
    Properties:
      RestApiId: !Ref AnalysisApi
      Description: !Sub 'Deployment for ${ResourcePrefix}'

  AnalysisApiStage:
    Type: AWS::ApiGateway::Stage
    DependsOn:
      - ApiGatewayAccount
    Properties:
      RestApiId: !Ref AnalysisApi
      DeploymentId: !Ref AnalysisApiDeployment
      StageName: !Ref ApiStageName
      AccessLogSetting:
        DestinationArn: !GetAtt AnalysisApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","sourceIp":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength"}'
      MethodSettings:
        - ResourcePath: /*
          HttpMethod: '*'
          LoggingLevel: ERROR
          DataTraceEnabled: false
          MetricsEnabled: true
      Tags:
        - Key: AnalysisStack
          Value: !Ref ResourcePrefix

  AnalysisApiDefault4xxCors:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref AnalysisApi
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Headers: "'Authorization,Content-Type'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'OPTIONS,POST'"
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'${FrontendOrigin}'"

  AnalysisApiDefault5xxCors:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref AnalysisApi
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Headers: "'Authorization,Content-Type'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'OPTIONS,POST'"
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'${FrontendOrigin}'"

  ProxyApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ProxyFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AnalysisApi}/*/POST/api/*'

  AuthorizerApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AuthorizerFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AnalysisApi}/authorizers/${AnalysisAuthorizer}'

Outputs:
  AnalysisApiBaseUrl:
    Description: API Gateway REST endpoint; no credentials are included.
    Value: !Sub 'https://${AnalysisApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${ApiStageName}'
  AnalysisPrivateIp:
    Value: !Ref AnalysisPrivateIp
  AnalysisInstanceId:
    Value: !Ref AnalysisInstance
  SandboxInstanceId:
    Value: !Ref SandboxInstance
  SourceBucketName:
    Value: !Ref SourceBucket
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  SandboxLifecycleTable:
    Value: !Ref AnalysisLifecycleTable
  SsmSessionLogGroupName:
    Value: !Ref AnalysisSsmSessionLogGroup
