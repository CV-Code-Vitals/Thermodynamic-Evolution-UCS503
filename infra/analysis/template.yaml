AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Isolated private UCS503 analysis and on-demand sandbox stack. This template does not manage the archive stack.

Parameters:
  ResourcePrefix:
    Type: String
    Default: ucs503-analysis-v1
    MinLength: 3
    MaxLength: 18
    AllowedPattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
    Description: Lowercase prefix for stack-owned resource names.
  AnalysisAmiId:
    Type: AWS::EC2::Image::Id
    Description: Approved analysis AMI with the analysis runtime and SSM Agent; configure manually before deployment.
  SandboxAmiId:
    Type: AWS::EC2::Image::Id
    Description: Approved sandbox AMI with the isolated broker/runtime and SSM Agent; configure manually before deployment.
  AnalysisInstanceType:
    Type: String
    Default: t3.small
    AllowedPattern: '^[a-z][a-z0-9.-]+$'
  SandboxInstanceType:
    Type: String
    Default: t3.small
    AllowedPattern: '^[a-z][a-z0-9.-]+$'
  AnalysisRootVolumeSizeGiB:
    Type: Number
    Default: 30
    MinValue: 8
    MaxValue: 16384
  SandboxRootVolumeSizeGiB:
    Type: Number
    Default: 20
    MinValue: 8
    MaxValue: 16384
  AnalysisDataVolumeSizeGiB:
    Type: Number
    Default: 100
    MinValue: 10
    MaxValue: 16384
    Description: Encrypted gp3 output/data volume; attached separately from the analysis root volume.
  AnalysisVpcCidr:
    Type: String
    Default: 10.80.0.0/16
  AnalysisSubnetCidr:
    Type: String
    Default: 10.80.1.0/24
  SandboxSubnetCidr:
    Type: String
    Default: 10.80.2.0/24
  AnalysisPrivateIp:
    Type: String
    Default: 10.80.1.10
    AllowedPattern: '^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$'
    Description: Stable private address on the analysis ENI; must be inside AnalysisSubnetCidr.
  SandboxPrivateIp:
    Type: String
    Default: 10.80.2.10
    AllowedPattern: '^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$'
    Description: Stable private address on the sandbox ENI; must be inside SandboxSubnetCidr.
  ApiStageName:
    Type: String
    Default: v1
    AllowedPattern: '^[A-Za-z0-9_-]+$'
  FrontendOrigin:
    Type: String
    Default: https://zylus08.github.io
    AllowedPattern: '^https://[A-Za-z0-9.-]+$'
    Description: Exact GitHub Pages origin allowed by browser CORS.
  ApiTokenParameterName:
    Type: String
    Default: /ucs503/analysis/api-token
  SigningKeyParameterName:
    Type: String
    Default: /ucs503/admin/token-hmac-key
  SandboxTokenParameterName:
    Type: String
    Default: /ucs503/analysis/sandbox-service-token
  SandboxTlsCertificateParameterName:
    Type: String
    Default: /ucs503/analysis/sandbox-tls-cert
  SandboxTlsPrivateKeyParameterName:
    Type: String
    Default: /ucs503/analysis/sandbox-tls-key
  SandboxCaParameterName:
    Type: String
    Default: /ucs503/analysis/sandbox-ca
  S3ManagedPrefixListId:
    Type: String
    AllowedPattern: '^pl-[0-9a-f]+$'
    Description: AWS-managed S3 prefix list ID for the deployment region.
  DynamoDbManagedPrefixListId:
    Type: String
    AllowedPattern: '^pl-[0-9a-f]+$'
    Description: AWS-managed DynamoDB prefix list ID for the deployment region.
  SsmSessionLogRetentionDays:
    Type: Number
    Default: 365
    AllowedValues: [30, 90, 180, 365, 400, 545, 731, 1096, 1827, 3653]

Resources:
  AnalysisVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref AnalysisVpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      InstanceTenancy: default
      Tags:
        - Key: Name
          Value: !Sub '${ResourcePrefix}-private-vpc'
        - Key: AnalysisStack
          Value: !Ref ResourcePrefix

  AnalysisVpcIpv6:
    Type: AWS::EC2::VPCCidrBlock
    Properties:
      VpcId: !Ref AnalysisVpc
      AmazonProvidedIpv6CidrBlock: true

  AnalysisSubnet:
    Type: AWS::EC2::Subnet
    DependsOn: AnalysisVpcIpv6
    Properties:
      VpcId: !Ref AnalysisVpc
      CidrBlock: !Ref AnalysisSubnetCidr
      Ipv6CidrBlock: !Select
        - 0
        - !Cidr
          - !Select [0, !GetAtt AnalysisVpc.Ipv6CidrBlocks]
          - 256
          - 64
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      AssignIpv6AddressOnCreation: true
      Tags:
        - Key: Name
          Value: !Sub '${ResourcePrefix}-analysis-private'
        - Key: AnalysisStack
          Value: !Ref ResourcePrefix

  SandboxSubnet:
    Type: AWS::EC2::Subnet
    DependsOn: AnalysisVpcIpv6
    Properties:
      VpcId: !Ref AnalysisVpc
      CidrBlock: !Ref SandboxSubnetCidr
      Ipv6CidrBlock: !Select
        - 1
        - !Cidr
          - !Select [0, !GetAtt AnalysisVpc.Ipv6CidrBlocks]
          - 256
          - 64
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      AssignIpv6AddressOnCreation: true
      Tags:
        - Key: Name
          Value: !Sub '${ResourcePrefix}-sandbox-private'
        - Key: AnalysisStack
          Value: !Ref ResourcePrefix

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref AnalysisVpc
      Tags:
        - Key: Name
          Value: !Sub '${ResourcePrefix}-private'

  AnalysisSubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AnalysisSubnet
      RouteTableId: !Ref PrivateRouteTable

  SandboxSubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SandboxSubnet
      RouteTableId: !Ref PrivateRouteTable

  SourceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-source-snapshots-after-one-day
            Status: Enabled
            Prefix: snapshots/
            ExpirationInDays: 1
          - Id: abort-incomplete-source-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: AnalysisStack
          Value: !Ref ResourcePrefix

  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-image-bundles-after-thirty-days
            Status: Enabled
            Prefix: bundles/
            ExpirationInDays: 30
          - Id: abort-incomplete-artifact-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: AnalysisStack
          Value: !Ref ResourcePrefix

  PrivateS3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Gateway
      VpcId: !Ref AnalysisVpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      RouteTableIds:
        - !Ref PrivateRouteTable
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadOnlyStackObjects
            Effect: Allow
            Principal:
              AWS:
                - !GetAtt AnalysisInstanceRole.Arn
                - !GetAtt SandboxInstanceRole.Arn
            Action: s3:GetObject
            Resource:
              - !Sub '${SourceBucket.Arn}/*'
              - !Sub '${ArtifactBucket.Arn}/*'

  PrivateDynamoDbGatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Gateway
      VpcId: !Ref AnalysisVpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.dynamodb'
      RouteTableIds:
        - !Ref PrivateRouteTable
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AnalysisLifecycleTableOnly
            Effect: Allow
            Principal:
              AWS: !GetAtt AnalysisInstanceRole.Arn
            Action: dynamodb:*
            Resource: !GetAtt AnalysisLifecycleTable.Arn

  InterfaceEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Accept HTTPS only from the analysis workloads for private AWS API access.
      VpcId: !Ref AnalysisVpc
      SecurityGroupEgress: []
      Tags:
        - Key: Name
          Value: !Sub '${ResourcePrefix}-interface-endpoints'
        - Key: AnalysisStack
          Value: !Ref ResourcePrefix

  ProxyToInterfaceEndpointsEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref ProxySecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationSecurityGroupId: !Ref InterfaceEndpointSecurityGroup

  AnalysisToInterfaceEndpointsEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AnalysisSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationSecurityGroupId: !Ref InterfaceEndpointSecurityGroup

  SandboxToInterfaceEndpointsEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref SandboxSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationSecurityGroupId: !Ref InterfaceEndpointSecurityGroup

  ProxyToInterfaceEndpointsIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref InterfaceEndpointSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref ProxySecurityGroup

  AnalysisToInterfaceEndpointsIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref InterfaceEndpointSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref AnalysisSecurityGroup

  SandboxToInterfaceEndpointsIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref InterfaceEndpointSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref SandboxSecurityGroup

  SsmEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref AnalysisVpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssm'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref AnalysisSubnet
      SecurityGroupIds:
        - !Ref InterfaceEndpointSecurityGroup
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SsmFromStackRolesOnly
            Effect: Allow
            Principal:
              AWS:
                - !GetAtt ProxyExecutionRole.Arn
                - !GetAtt AnalysisInstanceRole.Arn
                - !GetAtt SandboxInstanceRole.Arn
            Action: ssm:*
            Resource: '*'

  SsmMessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      VpcId: !Ref AnalysisVpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssmmessages'
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref AnalysisSubnet
      SecurityGroupIds:
        - !Ref InterfaceEndpointSecurityGroup
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SsmMessagesFromInstancesOnly
            Effect: Allow
            Principal:
              AWS:
                - !GetAtt AnalysisInstanceRole.Arn
                - !GetAtt SandboxInstanceRole.Arn
            Action: ssmmessages:*
            Resource: '*'

  Ec2MessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      VpcId: !Ref AnalysisVpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ec2messages'
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref AnalysisSubnet
      SecurityGroupIds:
        - !Ref InterfaceEndpointSecurityGroup
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: Ec2MessagesFromInstancesOnly
            Effect: Allow
            Principal:
              AWS:
                - !GetAtt AnalysisInstanceRole.Arn
                - !GetAtt SandboxInstanceRole.Arn
            Action: ec2messages:*
            Resource: '*'

  Ec2ApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      VpcId: !Ref AnalysisVpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ec2'
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref AnalysisSubnet
      SecurityGroupIds:
        - !Ref InterfaceEndpointSecurityGroup
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: Ec2FromAnalysisInstanceOnly
            Effect: Allow
            Principal:
              AWS: !GetAtt AnalysisInstanceRole.Arn
            Action:
              - ec2:DescribeInstances
              - ec2:StartInstances
              - ec2:StopInstances
            Resource: '*'

  LambdaApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      VpcId: !Ref AnalysisVpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.lambda'
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref AnalysisSubnet
      SecurityGroupIds:
        - !Ref InterfaceEndpointSecurityGroup
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: InvokeSourceStagerFromProxyOnly
            Effect: Allow
            Principal:
              AWS: !GetAtt ProxyExecutionRole.Arn
            Action: lambda:InvokeFunction
            Resource: !GetAtt SourceStagerFunction.Arn

  AnalysisToS3EndpointEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AnalysisSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationPrefixListId: !Ref S3ManagedPrefixListId

  SandboxToS3EndpointEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref SandboxSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationPrefixListId: !Ref S3ManagedPrefixListId

  AnalysisToDynamoDbEndpointEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AnalysisSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationPrefixListId: !Ref DynamoDbManagedPrefixListId

  SourceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SourceBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt SourceBucket.Arn
              - !Sub '${SourceBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub '${ArtifactBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  ProxySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Egress from the response-streaming proxy to private services only.
      VpcId: !Ref AnalysisVpc
      SecurityGroupEgress: []
      Tags:
        - Key: Name
          Value: !Sub '${ResourcePrefix}-proxy'
        - Key: AnalysisStack
          Value: !Ref ResourcePrefix

  AnalysisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private analysis API; only the proxy and sandbox broker may connect.
      VpcId: !Ref AnalysisVpc
      SecurityGroupEgress: []
      Tags:
        - Key: Name
          Value: !Sub '${ResourcePrefix}-analysis'
        - Key: AnalysisStack
          Value: !Ref ResourcePrefix

  SandboxSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private sandbox broker; only the analysis instance may connect.
      VpcId: !Ref AnalysisVpc
      SecurityGroupEgress: []
      Tags:
        - Key: Name
          Value: !Sub '${ResourcePrefix}-sandbox'
        - Key: AnalysisStack
          Value: !Ref ResourcePrefix

  ProxyToAnalysisEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref ProxySecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      DestinationSecurityGroupId: !Ref AnalysisSecurityGroup

  AnalysisFromProxyIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AnalysisSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref ProxySecurityGroup

  AnalysisToSandboxEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AnalysisSecurityGroup
      IpProtocol: tcp
      FromPort: 8082
      ToPort: 8082
      DestinationSecurityGroupId: !Ref SandboxSecurityGroup

  SandboxFromAnalysisIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SandboxSecurityGroup
      IpProtocol: tcp
      FromPort: 8082
      ToPort: 8082
      SourceSecurityGroupId: !Ref AnalysisSecurityGroup

  AnalysisLifecycleTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: AnalysisStack
          Value: !Ref ResourcePrefix

  AnalysisSsmSessionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub ['/aws/ssm/sessions/${ResourcePrefix}-${StackSuffix}', {StackSuffix: !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]}]
      RetentionInDays: !Ref SsmSessionLogRetentionDays

  ProxyLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub ['/aws/lambda/${ResourcePrefix}-analysis-proxy-${StackSuffix}', {StackSuffix: !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]}]
      RetentionInDays: 365

  AuthorizerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub ['/aws/lambda/${ResourcePrefix}-analysis-authorizer-${StackSuffix}', {StackSuffix: !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]}]
      RetentionInDays: 365

  SourceStagerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub ['/aws/lambda/${ResourcePrefix}-source-stager-${StackSuffix}', {StackSuffix: !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]}]
      RetentionInDays: 365

  LifecycleWatchdogLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub ['/aws/lambda/${ResourcePrefix}-sandbox-watchdog-${StackSuffix}', {StackSuffix: !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]}]
      RetentionInDays: 365

  ProxyExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ProxyRuntimeOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadAnonymousScanTokenOnly
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ApiTokenParameterName}'
              - Sid: DecryptAnonymousScanTokenOnly
                Effect: Allow
                Action: kms:Decrypt
                Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'
                    kms:EncryptionContext:PARAMETER_ARN: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ApiTokenParameterName}'
                  ForAnyValue:StringEquals:
                    kms:ResourceAliases:
                      - alias/aws/ssm
              - Sid: InvokeSourceStagerOnly
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt SourceStagerFunction.Arn
              - Sid: WriteProxyLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${ProxyLogGroup.Arn}:*'
              - Sid: VpcNetworkInterfaces
                Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: '*'

  AuthorizerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AuthorizerSecretReads
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadSigningKeyAndAnalysisToken
                Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SigningKeyParameterName}'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ApiTokenParameterName}'
              - Sid: DecryptSigningKeyAndAnalysisToken
                Effect: Allow
                Action: kms:Decrypt
                Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'
                  ForAnyValue:StringLike:
                    kms:EncryptionContext:PARAMETER_ARN:
                      - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SigningKeyParameterName}'
                      - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ApiTokenParameterName}'
                  ForAnyValue:StringEquals:
                    kms:ResourceAliases:
                      - alias/aws/ssm
              - Sid: WriteAuthorizerLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${AuthorizerLogGroup.Arn}:*'

  SourceStagerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteStagedSources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PutSourceSnapshots
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${SourceBucket.Arn}/snapshots/*'
              - Sid: WriteStagerLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${SourceStagerLogGroup.Arn}:*'

  AnalysisInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: AnalysisRuntimeResources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadStagedSources
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${SourceBucket.Arn}/snapshots/*'
              - Sid: ReadDeploymentBundles
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${ArtifactBucket.Arn}/bundles/*'
              - Sid: ReadAnalysisRuntimeSecrets
                Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ApiTokenParameterName}'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SandboxTokenParameterName}'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SandboxCaParameterName}'
              - Sid: DecryptAnalysisRuntimeSecrets
                Effect: Allow
                Action: kms:Decrypt
                Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'
                  ForAnyValue:StringEquals:
                    kms:ResourceAliases:
                      - alias/aws/ssm
                    kms:EncryptionContext:PARAMETER_ARN:
                      - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ApiTokenParameterName}'
                      - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SandboxTokenParameterName}'
                      - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SandboxCaParameterName}'
              - Sid: UseSandboxLifecycleItem
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt AnalysisLifecycleTable.Arn
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys:
                      - sandbox-lifecycle
              - Sid: StartAndStopOnlyTheSandboxInstance
                Effect: Allow
                Action:
                  - ec2:StartInstances
                  - ec2:StopInstances
                Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${SandboxInstance}'
              # DescribeInstances does not support resource-tag conditions. Limit
              # the account-wide read to this stack's deployment region instead.
              - Sid: DescribeInstancesInStackRegion
                Effect: Allow
                Action: ec2:DescribeInstances
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              - Sid: WriteAnalysisSsmSessionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${AnalysisSsmSessionLogGroup.Arn}:*'

  SandboxInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: SandboxRuntimeSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadBrokerCredentialsOnly
                Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SandboxTokenParameterName}'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SandboxTlsCertificateParameterName}'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SandboxTlsPrivateKeyParameterName}'
              - Sid: DecryptBrokerCredentialsOnly
                Effect: Allow
                Action: kms:Decrypt
                Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'
                  ForAnyValue:StringLike:
                    kms:EncryptionContext:PARAMETER_ARN:
                      - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SandboxTokenParameterName}'
                      - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SandboxTlsCertificateParameterName}'
                      - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SandboxTlsPrivateKeyParameterName}'
                  ForAnyValue:StringEquals:
                    kms:ResourceAliases:
                      - alias/aws/ssm
              - Sid: ReadDeploymentBundles
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${ArtifactBucket.Arn}/bundles/analysis-deployments/*'
              - Sid: WriteSandboxSsmSessionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${AnalysisSsmSessionLogGroup.Arn}:*'

  LifecycleWatchdogRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReconcileSandboxIdleState
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadAndUpdateLifecycleItem
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt AnalysisLifecycleTable.Arn
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys:
                      - sandbox-lifecycle
              - Sid: StopOnlyTheSandboxInstance
                Effect: Allow
                Action: ec2:StopInstances
                Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${SandboxInstance}'
              # DescribeInstances does not support resource-tag conditions. Limit
              # the account-wide read to this stack's deployment region instead.
              - Sid: DescribeInstancesInStackRegion
                Effect: Allow
                Action: ec2:DescribeInstances
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              - Sid: WriteWatchdogLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${LifecycleWatchdogLogGroup.Arn}:*'

  AnalysisInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref AnalysisInstanceRole

  SandboxInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref SandboxInstanceRole

  AnalysisPrivateNetworkInterface:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref AnalysisSubnet
      PrivateIpAddress: !Ref AnalysisPrivateIp
      Ipv6AddressCount: 1
      GroupSet:
        - !Ref AnalysisSecurityGroup
      SourceDestCheck: true
      Tags:
        - Key: Name
          Value: !Sub '${ResourcePrefix}-analysis-eni'
        - Key: AnalysisStack
          Value: !Ref ResourcePrefix

  SandboxPrivateNetworkInterface:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref SandboxSubnet
      PrivateIpAddress: !Ref SandboxPrivateIp
      Ipv6AddressCount: 1
      GroupSet:
        - !Ref SandboxSecurityGroup
      SourceDestCheck: true
      Tags:
        - Key: Name
          Value: !Sub '${ResourcePrefix}-sandbox-eni'
        - Key: AnalysisStack
          Value: !Ref ResourcePrefix

  SandboxInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref SandboxAmiId
      InstanceType: !Ref SandboxInstanceType
      IamInstanceProfile: !Ref SandboxInstanceProfile
      NetworkInterfaces:
        - DeviceIndex: '0'
          NetworkInterfaceId: !Ref SandboxPrivateNetworkInterface
          DeleteOnTermination: false
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref SandboxRootVolumeSizeGiB
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub '${ResourcePrefix}-sandbox'
        - Key: AnalysisStack
          Value: !Ref ResourcePrefix

  AnalysisDataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !Select [0, !GetAZs '']
      Size: !Ref AnalysisDataVolumeSizeGiB
      VolumeType: gp3
      Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub '${ResourcePrefix}-analysis-data'
        - Key: AnalysisStack
          Value: !Ref ResourcePrefix

  AnalysisInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - PrivateS3GatewayEndpoint
      - PrivateDynamoDbGatewayEndpoint
    Properties:
      ImageId: !Ref AnalysisAmiId
      InstanceType: !Ref AnalysisInstanceType
      IamInstanceProfile: !Ref AnalysisInstanceProfile
      NetworkInterfaces:
        - DeviceIndex: '0'
          NetworkInterfaceId: !Ref AnalysisPrivateNetworkInterface
          DeleteOnTermination: false
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref AnalysisRootVolumeSizeGiB
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          install -d -m 0750 /var/lib/ucs503-analysis
          VOLUME_ID='${AnalysisDataVolume}'
          VOLUME_ID_COMPACT="$(printf '%s' "$VOLUME_ID" | tr -d '-')"
          DEVICE="/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_$VOLUME_ID_COMPACT"
          for attempt in $(seq 1 60); do
            [ -b "$DEVICE" ] && break
            sleep 2
          done
          [ -b "$DEVICE" ]
          if ! blkid "$DEVICE"; then
            mkfs.xfs "$DEVICE"
          fi
          DATA_UUID="$(blkid -s UUID -o value "$DEVICE")"
          grep -q "$DATA_UUID" /etc/fstab || printf 'UUID=%s /var/lib/ucs503-analysis xfs defaults,nofail 0 2\n' "$DATA_UUID" >> /etc/fstab
          mount /var/lib/ucs503-analysis
          install -d -m 0750 /var/lib/ucs503-analysis/uploads
          chown 10002:10002 /var/lib/ucs503-analysis /var/lib/ucs503-analysis/uploads
          chmod 0750 /var/lib/ucs503-analysis
      Tags:
        - Key: Name
          Value: !Sub '${ResourcePrefix}-analysis'
        - Key: AnalysisStack
          Value: !Ref ResourcePrefix

  AnalysisDataVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdf
      InstanceId: !Ref AnalysisInstance
      VolumeId: !Ref AnalysisDataVolume

  SnapshotLifecycleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: dlm.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: ManageAnalysisDataSnapshots
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateSnapshot
                  - ec2:CreateTags
                  - ec2:DeleteSnapshot
                  - ec2:DescribeVolumes
                  - ec2:DescribeSnapshots
                Resource: '*'
                Condition:
                  StringEquals:
                    ec2:ResourceTag/AnalysisStack: !Ref ResourcePrefix

  AnalysisDataSnapshotPolicy:
    Type: AWS::DLM::LifecyclePolicy
    Properties:
      Description: Daily encrypted snapshots of persistent analysis data volume retain seven
      ExecutionRoleArn: !GetAtt SnapshotLifecycleRole.Arn
      State: ENABLED
      PolicyDetails:
        PolicyType: EBS_SNAPSHOT_MANAGEMENT
        ResourceTypes:
          - VOLUME
        TargetTags:
          - Key: AnalysisStack
            Value: !Ref ResourcePrefix
          - Key: Name
            Value: !Sub '${ResourcePrefix}-analysis-data'
        Schedules:
          - Name: daily-seven-day-retention
            CopyTags: true
            CreateRule:
              Interval: 24
              IntervalUnit: HOURS
              Times:
                - '03:00'
            RetainRule:
              Count: 7

