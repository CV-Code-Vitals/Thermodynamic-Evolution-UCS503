user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Backend API upstream matching the docker-compose service name
    upstream go_api {
        server api:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Route /api/ traffic to the internal Go backend container
        location /api/ {
            # We rewrite the URL to strip /api/ before passing it to Go
            # so the Go app handles /status instead of /api/status
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://go_api;
            
            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Deny access to hidden files (.env, .git, etc.)
        location ~ /\. {
            deny all;
        }
    }
}
