# LEGACY: manual-only; do not use for the split EC2 deployment.
# This single-host file retains obsolete API/RDS and shared-volume assumptions.
services:
  ucs503-api:
    image: ghcr.io/cv-code-vitals/ucs503-api:${IMAGE_TAG:-latest}
    restart: always
    env_file:
      - .env
    environment:
      APP_ENV: standalone
      ADMIN_PASSKEY: ${ADMIN_PASSKEY:?Set ADMIN_PASSKEY in .env}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
      S3_REGION: ${S3_REGION:?Set S3_REGION in .env}
      TRUST_PROXY: "true"
    ports:
      - "8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - api_uploads:/app/uploads
      - api_data:/app/data
    networks:
      - public_net

  ucs503-analysis:
    image: ghcr.io/cv-code-vitals/ucs503-analysis:${IMAGE_TAG:-latest}
    restart: always
    environment:
      ANALYSIS_API_TOKEN: ${ANALYSIS_API_TOKEN:?set ANALYSIS_API_TOKEN in .env}
      DATABASE_URL: ${DATABASE_URL:-}
      ENGINE_PATH: /app/thermodynamic-ast-engine
      GIN_MODE: release
      PORT: "8080"
      SANDBOX_SERVICE_URL: http://ucs503-sandbox-broker:8082
      SANDBOX_SERVICE_TOKEN: ${SANDBOX_SERVICE_TOKEN:?Set SANDBOX_SERVICE_TOKEN in .env}
      SANDBOX_WORKSPACE_DIR: /app/sandboxes
    ports:
      - "127.0.0.1:8081:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - analysis_uploads:/app/uploads
      - sandboxes_shared:/app/sandboxes
    networks:
      - public_net
      - sandbox_internal
    depends_on:
      ucs503-sandbox-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  ucs503-sandbox-broker:
    image: ghcr.io/cv-code-vitals/ucs503-analysis:${IMAGE_TAG:-latest}
    restart: always
    user: "root"
    command: ["./backend_server", "--broker"]
    environment:
      SANDBOX_SERVICE_MODE: "true"
      SANDBOX_SERVICE_TOKEN: ${SANDBOX_SERVICE_TOKEN:?Set SANDBOX_SERVICE_TOKEN in .env}
      SANDBOX_RUNNER_IMAGE: ghcr.io/cv-code-vitals/ucs503-sandbox-runner:${IMAGE_TAG:-latest}
      SANDBOX_WORKSPACE_DIR: /app/sandboxes
      PORT: "8082"
    expose:
      - "8082"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sandboxes_shared:/app/sandboxes
      - analysis_uploads:/app/uploads:ro
    networks:
      - sandbox_internal
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  api_uploads:
  api_data:
  analysis_uploads:
  sandboxes_shared:

networks:
  public_net:
  sandbox_internal:
    internal: true
