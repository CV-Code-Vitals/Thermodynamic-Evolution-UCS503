# LEGACY: manual-only; do not use for the split EC2 deployment.
# This single-host file retains obsolete API/RDS and shared-volume assumptions.
services:
  https:
    image: caddy:2-alpine
    restart: always
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set the public API hostname with DNS pointing to this server}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public_net
    depends_on:
      ucs503-api:
        condition: service_healthy

  ucs503-api:
    image: ghcr.io/cv-code-vitals/ucs503-api:${IMAGE_TAG:?Set the tested commit SHA}
    restart: always
    environment:
      APP_ENV: production
      API_RUNTIME: http
      AWS_REGION: ${AWS_REGION:?Set the region of the existing archive stack}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
      DYNAMODB_TABLE: ${DYNAMODB_TABLE:?Set the existing archive table name}
      ADMIN_PASSKEY_PARAMETER: ${ADMIN_PASSKEY_PARAMETER:?Set the existing SSM passkey parameter name}
      TOKEN_HMAC_KEY_PARAMETER: ${TOKEN_HMAC_KEY_PARAMETER:?Set the existing SSM signing-key parameter name}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://cv-code-vitals.github.io}
      TRUST_PROXY: "true"
      ANALYSIS_SERVICE_URL: http://ucs503-analysis:8080
      ANALYSIS_API_TOKEN: ${ANALYSIS_API_TOKEN:?Set ANALYSIS_API_TOKEN in .env}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - public_net

  ucs503-analysis:
    image: ghcr.io/cv-code-vitals/ucs503-analysis:${IMAGE_TAG:?Set the tested commit SHA}
    restart: always
    environment:
      ANALYSIS_API_TOKEN: ${ANALYSIS_API_TOKEN:?set ANALYSIS_API_TOKEN in .env}
      DATABASE_URL: ${DATABASE_URL:-}
      ENGINE_PATH: /app/thermodynamic-ast-engine
      GIN_MODE: release
      PORT: "8080"
      SANDBOX_SERVICE_URL: https://ucs503-sandbox-broker:8082
      SANDBOX_TLS_CA_FILE: /run/ucs503-tls/broker.crt
      SANDBOX_SERVICE_TOKEN: ${SANDBOX_SERVICE_TOKEN:?Set SANDBOX_SERVICE_TOKEN in .env}
      EVOLVE_MAX_CONCURRENCY: ${EVOLVE_MAX_CONCURRENCY:-1}
    ports:
      - "127.0.0.1:8081:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - analysis_uploads:/app/uploads
      - ${SANDBOX_TLS_DIR:?Set the broker TLS directory}:/run/ucs503-tls:ro
    networks:
      - public_net
      - sandbox_internal
    depends_on:
      ucs503-sandbox-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  ucs503-sandbox-broker:
    image: ghcr.io/cv-code-vitals/ucs503-analysis:${IMAGE_TAG:?Set the tested commit SHA}
    restart: always
    user: "root"
    command: ["./backend_server", "--broker"]
    environment:
      SANDBOX_SERVICE_MODE: "true"
      SANDBOX_SERVICE_TOKEN: ${SANDBOX_SERVICE_TOKEN:?Set SANDBOX_SERVICE_TOKEN in .env}
      SANDBOX_RUNNER_IMAGE: ghcr.io/cv-code-vitals/ucs503-sandbox-runner:${IMAGE_TAG:?Set the tested commit SHA}
      SANDBOX_TLS_CERT_FILE: /run/ucs503-tls/broker.crt
      SANDBOX_TLS_KEY_FILE: /run/ucs503-tls/broker.key
      SANDBOX_BROKER_WORKSPACE_DIR: ${SANDBOX_HOST_DIR:?Set an absolute host directory}/broker
      SANDBOX_WORKSPACE_DIR: ${SANDBOX_HOST_DIR:?Set an absolute host directory for sandbox workspaces}
      EVOLVE_MAX_CONCURRENCY: ${EVOLVE_MAX_CONCURRENCY:-1}
      PORT: "8082"
    expose:
      - "8082"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SANDBOX_HOST_DIR:?Set an absolute host directory}:${SANDBOX_HOST_DIR:?Set an absolute host directory}
      - ${SANDBOX_TLS_DIR:?Set the broker TLS directory}:/run/ucs503-tls:ro
    networks:
      - sandbox_internal
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --ca-certificate=/run/ucs503-tls/broker.crt -qO- https://localhost:8082/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  caddy_data:
  caddy_config:
  analysis_uploads:

networks:
  public_net:
  sandbox_internal:
    internal: true
