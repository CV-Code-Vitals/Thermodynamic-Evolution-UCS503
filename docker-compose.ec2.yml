services:
  ucs503-api:
    image: ghcr.io/cv-code-vitals/ucs503-api:${IMAGE_TAG:-latest}
    restart: always
    env_file:
      - .env
    environment:
      APP_ENV: production
      ADMIN_PASSKEY: ${ADMIN_PASSKEY:?Set ADMIN_PASSKEY in .env}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
      S3_REGION: ${S3_REGION:?Set S3_REGION in .env}
      TRUST_PROXY: "true"
    ports:
      - "8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - api_uploads:/app/uploads
      - api_data:/app/data

  ucs503-analysis:
    image: ghcr.io/cv-code-vitals/ucs503-analysis:${IMAGE_TAG:-latest}
    restart: always
    environment:
      ANALYSIS_API_TOKEN: ${ANALYSIS_API_TOKEN:?set ANALYSIS_API_TOKEN in .env}
      DATABASE_URL: ${DATABASE_URL:-}
      ENGINE_PATH: /app/thermodynamic-ast-engine
      GIN_MODE: release
      PORT: "8080"
    ports:
      - "127.0.0.1:8081:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - analysis_uploads:/app/uploads

volumes:
  api_uploads:
  api_data:
  analysis_uploads:

