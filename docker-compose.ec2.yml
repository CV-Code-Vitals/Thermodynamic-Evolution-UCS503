version: '3.8'

services:
  ucs503-api:
    image: ghcr.io/zylus08/ucs503-api:latest
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    # If you prefer to proxy via nginx on the host, expose only on 127.0.0.1:8080
    # ports:
    #   - "127.0.0.1:8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - api_uploads:/app/uploads
      - api_data:/app/data

volumes:
  api_uploads:
  api_data:

