[package]
name        = "thermodynamic-ast-engine"
version     = "2.0.0"
edition     = "2021"
authors     = ["Saksham Mishra <[mishrasaksham080705@gmail.com]>"]
description = "Tree-sitter AST-driven thermodynamic entropy analyzer for Go/Python source code"
readme      = "README.md"
license     = "MIT"

# ── Feature flags ────────────────────────────────────────────────────────────
[features]
default = ["parallel"]
parallel = ["rayon"]

# ── Runtime dependencies ──────────────────────────────────────────────────────
[dependencies]

# JSON serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI argument parsing
clap = { version = "4.4", features = ["derive", "color"] }

# Recursive directory walking
walkdir = "2"

# Tree-sitter core + language grammars (AST-driven analysis)
tree-sitter = "0.24"
tree-sitter-go     = "0.23"
tree-sitter-python = "0.23"

# Data-parallelism (feature-gated)
rayon = { version = "1", optional = true }

# Timestamps
chrono = { version = "0.4", features = ["serde"] }

# Colored terminal output
colored = "2"

# ── Build profile: release ────────────────────────────────────────────────────
[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true

# ── Build profile: dev ────────────────────────────────────────────────────────
[profile.dev]
opt-level = 0
debug     = true
