[package]
name        = "thermodynamic-ast-engine"
version     = "0.1.0"
edition     = "2021"
authors     = ["Saksham Mishra <[mishrasaksham080705@gmail.com]>"]
description = "Heuristic-based thermodynamic entropy analyzer for Go/Python source code"
readme      = "README.md"
license     = "MIT"

# ── Feature flags ────────────────────────────────────────────────────────────
[features]
# Enable parallel file scanning via Rayon (on by default)
default = ["parallel"]
parallel = ["rayon"]

# ── Runtime dependencies ──────────────────────────────────────────────────────
[dependencies]

# Fast, ergonomic JSON serialization / deserialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Command-line argument parsing (clap v4 with derive macros)
clap = { version = "4.4", features = ["derive", "color"] }

# Recursive directory walking — fast & cross-platform
walkdir = "2"

# Compiled regex engine (thread-safe, zero-allocation hot paths)
regex = "1"

# Lazy statics so compiled regexes are built once, then reused
once_cell = "1"

# Data-parallelism library (feature-gated)
rayon = { version = "1", optional = true }

# Human-readable time for timestamps in the report
chrono = { version = "0.4", features = ["serde"] }

# Colored terminal output for the summary banner
colored = "2"

# ── Build profile: release ────────────────────────────────────────────────────
[profile.release]
opt-level   = 3        # maximum optimization
lto         = true     # link-time optimisation (reduces binary size & improves speed)
codegen-units = 1      # single codegen unit — slower compile, faster binary
strip       = true     # strip symbols from the release binary

# ── Build profile: dev  ───────────────────────────────────────────────────────
[profile.dev]
opt-level = 0
debug     = true
