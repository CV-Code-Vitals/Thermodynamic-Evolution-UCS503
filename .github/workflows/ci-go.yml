name: CI - Go build & vet

on:
  push:
    paths:
      - 'api/**'
      - 'go-backend/**'
      - 'template.yaml'
      - '.github/workflows/ci-go.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'go-backend/**'
      - 'template.yaml'
      - '.github/workflows/ci-go.yml'

jobs:
  go-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Install dependencies
        run: |
          cd api
          go mod download

      - name: go vet
        run: |
          cd api
          go vet ./...

      - name: go test
        run: |
          cd api
          go test ./...

      - name: go build
        run: |
          cd api
          go build ./...

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          version: 1.x

      - name: Validate and build serverless template
        run: |
          sam validate --lint --template-file template.yaml
          sam build --template-file template.yaml

      - name: Check analysis backend
        run: |
          cd go-backend
          go mod download
          go vet ./...
          go test ./...
          go build ./...
