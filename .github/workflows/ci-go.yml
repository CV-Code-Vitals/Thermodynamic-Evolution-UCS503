name: CI - Go build & vet

on:
  push:
    paths:
      - 'api/**'
      - 'analysis-authorizer/**'
      - 'source-stager/**'
      - 'go-backend/**'
      - 'thermodynamic-ast-engine/**'
      - 'docker/**'
      - 'docker-compose*.yml'
      - '.env*.example'
      - 'scripts/compose-config.test.mjs'
      - 'scripts/validate-sandbox-host.mjs'
      - 'tests/**'
      - '.github/workflows/deploy-analysis.yml'
      - 'infra/analysis/**'
      - 'template.yaml'
      - '.github/workflows/ci-go.yml'
      - '.github/workflows/publish-api-image.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'analysis-authorizer/**'
      - 'source-stager/**'
      - 'go-backend/**'
      - 'thermodynamic-ast-engine/**'
      - 'docker/**'
      - 'docker-compose*.yml'
      - '.env*.example'
      - 'scripts/compose-config.test.mjs'
      - 'scripts/validate-sandbox-host.mjs'
      - 'tests/**'
      - '.github/workflows/deploy-analysis.yml'
      - 'infra/analysis/**'
      - 'template.yaml'
      - '.github/workflows/ci-go.yml'
      - '.github/workflows/publish-api-image.yml'

permissions:
  contents: read

jobs:
  go-checks:
    runs-on: ubuntu-latest
    env:
      SANDBOX_RUNNER_IMAGE: ucs503-sandbox-runner:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node for deployment configuration tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate split Compose configurations
        run: |
          node --test \
            scripts/compose-config.test.mjs \
            tests/analysis-template.test.mjs \
            tests/analysis-workflow.test.mjs \
            tests/sandbox-host-validation.test.mjs
          docker compose --env-file .env.analysis.example -f docker-compose.analysis.yml config --quiet
          docker compose --env-file .env.sandbox.example -f docker-compose.sandbox.yml config --quiet

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: |
            api/go.sum
            analysis-authorizer/go.sum
            source-stager/go.sum
            go-backend/go.sum

      - name: Install dependencies
        run: |
          cd api
          go mod download

      - name: go vet
        run: |
          cd api
          go vet ./...

      - name: go test
        run: |
          cd api
          go test ./...

      - name: go build
        run: |
          cd api
          go build ./...

      - name: Test and vet REST authorizer
        run: |
          cd analysis-authorizer
          go mod download
          go test ./...
          go vet ./...
          go build ./...

      - name: Test source staging and streaming proxy
        run: |
          (cd source-stager && go test ./... && go vet ./... && go build ./...)
          (cd infra/analysis/stream-proxy && npm ci && npm test)

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          version: 1.169.0

      - name: Validate and build serverless template
        run: |
          sam validate --lint --template-file template.yaml
          sam validate --lint --template-file infra/analysis/template.yaml
          sam build --template-file template.yaml
          sam build --template-file infra/analysis/template.yaml

      - name: Verify and configure Rust toolchain
        run: |
          if ! command -v rustup &> /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup default stable
          rustc --version
          cargo --version

      - name: Build and Test Rust Thermodynamic AST Engine
        run: |
          cd thermodynamic-ast-engine
          cargo test
          cargo build --release

      - name: Build Docker Sandbox Runner Image
        run: |
          docker build -t "$SANDBOX_RUNNER_IMAGE" -f docker/sandbox-runner/Dockerfile .

      - name: Run live Docker sandbox integration tests
        shell: bash
        run: |
          set -o pipefail
          cd go-backend
          export ENGINE_PATH="$GITHUB_WORKSPACE/thermodynamic-ast-engine/target/release/thermodynamic-ast-engine"
          export RUN_LIVE_SANDBOX_TESTS=1
          go test -count=1 -v -run '^(TestDockerEvaluator_LiveExecution|TestDockerContainerRunner_LiveVerification|TestSnapshotPortalScanEvolutionAndPatch)$' \
            . ./agent ./agent/repo_intel/execution 2>&1 | tee sandbox_test.log
          for test in TestDockerEvaluator_LiveExecution TestDockerContainerRunner_LiveVerification TestSnapshotPortalScanEvolutionAndPatch; do
            if ! grep -Fq -- "--- PASS: $test (" sandbox_test.log; then
              echo "::error::Mandatory live sandbox test did not pass: $test"
              exit 1
            fi
          done

      - name: Check analysis backend
        shell: bash
        run: |
          set -o pipefail
          cd go-backend
          go mod download
          go vet ./...
          export ENGINE_PATH="$GITHUB_WORKSPACE/thermodynamic-ast-engine/target/release/thermodynamic-ast-engine"
          test -x "$ENGINE_PATH"
          if ! go test -count=1 -v ./... 2>&1 | tee backend_test.log; then
            grep -E '^--- FAIL:|^FAIL[[:space:]]' backend_test.log || true
            exit 1
          fi
          go build ./...

      - name: Upload Go backend test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-backend-test-logs
          path: |
            go-backend/sandbox_test.log
            go-backend/backend_test.log
