name: Deploy Backends to EC2

on:
  workflow_dispatch:
    inputs:
      enable_ec2_deployment:
        description: Explicitly opt in to the legacy EC2 deployment workflow
        required: true
        type: boolean
        default: false

jobs:
  prepare-server:
    runs-on: ubuntu-latest
    if: ${{ inputs.enable_ec2_deployment && vars.EC2_DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Create deployment directory
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || '22' }}
          script: mkdir -p ~/ucs503

  deploy:
    runs-on: ubuntu-latest
    needs: prepare-server
    if: ${{ inputs.enable_ec2_deployment && vars.EC2_DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Copy Compose configuration to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || '22' }}
          source: docker-compose.ec2.yml,docker/Caddyfile
          target: ~/ucs503/

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.9
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || '22' }}
          envs: GHCR_PAT,GHCR_USER,IMAGE_TAG
          script: |
            set -e
            cd ~/ucs503
            docker compose -f docker-compose.ec2.yml config --quiet
            printf '%s' "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            docker compose -f docker-compose.ec2.yml pull
            docker pull "ghcr.io/cv-code-vitals/ucs503-sandbox-runner:${IMAGE_TAG}"
            docker compose -f docker-compose.ec2.yml up -d --remove-orphans

  deployment-not-configured:
    runs-on: ubuntu-latest
    if: ${{ !inputs.enable_ec2_deployment || vars.EC2_DEPLOY_ENABLED != 'true' }}
    steps:
      - name: Explain skipped deployment
        run: 'echo "Legacy EC2 deployment skipped. Set the manual opt-in input and EC2_DEPLOY_ENABLED=true only after separately approving and configuring EC2."'
