name: Deploy Backends to EC2

on:
  workflow_run:
    workflows:
      - Publish Backend Docker Images
    types:
      - completed
    branches:
      - main

jobs:
  prepare-server:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.EC2_DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Create deployment directory
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || '22' }}
          script: mkdir -p ~/ucs503

  deploy:
    runs-on: ubuntu-latest
    needs: prepare-server
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.EC2_DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Copy Compose configuration to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || '22' }}
          source: docker-compose.ec2.yml
          target: ~/ucs503/

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || '22' }}
          script: |
            set -e
            cd ~/ucs503
            export IMAGE_TAG='${{ github.event.workflow_run.head_sha }}'
            echo "Logging into ghcr..."
            echo '${{ secrets.GHCR_PAT }}' | docker login ghcr.io -u '${{ github.repository_owner }}' --password-stdin
            docker compose -f docker-compose.ec2.yml pull
            docker compose -f docker-compose.ec2.yml up -d --remove-orphans

  deployment-not-configured:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.EC2_DEPLOY_ENABLED != 'true' }}
    steps:
      - name: Explain skipped deployment
        run: 'echo "EC2 deployment skipped: configure EC2_HOST, EC2_USER, EC2_SSH_PRIVATE_KEY, GHCR_PAT, and EC2_DEPLOY_ENABLED=true."'
