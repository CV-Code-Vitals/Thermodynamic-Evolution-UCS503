name: Publish Analysis and Sandbox Images

on:
  push:
    branches:
      - main
    paths:
      - 'go-backend/**'
      - 'thermodynamic-ast-engine/**'
      - 'docker/**'
      - '.dockerignore'
      - '.github/workflows/publish-api-image.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push analysis backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./go-backend/Dockerfile
          push: true
          tags: ghcr.io/cv-code-vitals/ucs503-analysis:${{ github.sha }}

      - name: Build and push sandbox runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/sandbox-runner/Dockerfile
          push: true
          tags: ghcr.io/cv-code-vitals/ucs503-sandbox-runner:${{ github.sha }}
