name: Publish Backend Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'go-backend/**'
      - 'thermodynamic-ast-engine/**'
      - 'docker-compose.ec2.yml'
      - '.github/workflows/publish-api-image.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v4
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ghcr.io/cv-code-vitals/ucs503-api:latest
            ghcr.io/cv-code-vitals/ucs503-api:${{ github.sha }}

      - name: Build and push analysis backend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./go-backend/Dockerfile
          push: true
          tags: |
            ghcr.io/cv-code-vitals/ucs503-analysis:latest
            ghcr.io/cv-code-vitals/ucs503-analysis:${{ github.sha }}
