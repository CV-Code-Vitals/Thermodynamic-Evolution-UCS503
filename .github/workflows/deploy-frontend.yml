name: Deploy Frontend to GitHub Pages

permissions:
  contents: read

on:
  push:
    branches:
      - main

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: ./admin-portal
        run: npm ci

      - name: Test production API configuration
        working-directory: ./admin-portal
        run: npm test

      - name: Lint frontend
        working-directory: ./admin-portal
        run: npm run lint

      - name: Build (Vite)
        working-directory: ./admin-portal
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_ANALYSIS_API_BASE: ${{ vars.UCS503_ANALYSIS_API_BASE }}
        run: |
          npm run build

      - name: Assemble Pages site
        run: |
          mkdir -p _site/admin-portal
          cp index.html _site/
          cp -R assets graph-visualizer _site/
          cp -R admin-portal/dist/. _site/admin-portal/
          cp -R admin-portal/dist/graph-visualizer/. _site/graph-visualizer/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
