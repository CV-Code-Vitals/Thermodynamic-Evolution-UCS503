name: Deploy Frontend to GitHub Pages

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: ./admin-portal
        run: npm ci

      - name: Test production API configuration
        working-directory: ./admin-portal
        run: npm test

      - name: Lint frontend
        working-directory: ./admin-portal
        run: npm run lint

      - name: Build (Vite)
        working-directory: ./admin-portal
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_ANALYSIS_API_BASE: ${{ vars.UCS503_ANALYSIS_API_BASE }}
        run: |
          npm run build

      - name: Assemble Pages site
        run: |
          mkdir -p _site/admin-portal
          cp index.html _site/
          cp -R assets graph-visualizer _site/
          cp -R admin-portal/dist/. _site/admin-portal/
          touch _site/.nojekyll

      - name: Configure public Graph Visualizer API
        working-directory: .
        env:
          UCS503_ANALYSIS_API_BASE: ${{ vars.UCS503_ANALYSIS_API_BASE }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';

          const configuredBase = process.env.UCS503_ANALYSIS_API_BASE;
          if (!configuredBase) {
            throw new Error('Set the public UCS503_ANALYSIS_API_BASE repository variable before deploying Pages.');
          }
          const apiURL = new URL(configuredBase);
          if (apiURL.protocol !== 'https:' || apiURL.username || apiURL.password || apiURL.search || apiURL.hash) {
            throw new Error('UCS503_ANALYSIS_API_BASE must be a public HTTPS API base URL without credentials, query, or fragment.');
          }
          const publicBase = apiURL.toString().replace(/\/+$/, '');
          await writeFile(
            '_site/graph-visualizer/config.js',
            `window.UCS503_ANALYSIS_API_BASE = ${JSON.stringify(publicBase)};\n`,
          );
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
