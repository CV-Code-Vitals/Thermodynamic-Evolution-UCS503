name: Deploy Frontend to GitHub Pages

permissions:
  contents: write

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: ./admin-portal
        run: npm ci

      - name: Build (Vite)
        working-directory: ./admin-portal
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: npm run build

      - name: Assemble Pages site
        run: |
          mkdir -p _site/admin-portal
          cp index.html _site/
          cp -R assets graph-visualizer _site/
          cp -R admin-portal/dist/. _site/admin-portal/
          touch _site/.nojekyll

      - name: Publish Pages site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
