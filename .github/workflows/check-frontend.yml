name: Check portal

on:
  pull_request:
    paths:
      - 'admin-portal/**'
      - 'graph-visualizer/**'
      - '.github/workflows/check-frontend.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-portal/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_BASE: https://verification.invalid/api
      - run: npm audit --audit-level=high
